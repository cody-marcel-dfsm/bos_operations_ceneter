interface:
  display_name: "BOS MCP Client"
  short_description: "Run tenant-safe iCode and BOS operations"
  default_prompt: "Use $bos-mcp-client to handle an iCode operations request through the correct BOS sources and permissions."
dependencies:
  tools:
    - type: "mcp"
      value: "bos_icode"
      description: "BOS remote agent gateway for iCode organization"
      transport: "streamable_http"
      url: "https://dfsm.ai/mcp"
    - type: "mcp"
      value: "bos_dfsm"
      description: "BOS remote agent gateway for DFSM.ai and Infinite State Machines"
      transport: "streamable_http"
      url: "https://dfsm.ai/mcp"
policy:
  allow_implicit_invocation: true
