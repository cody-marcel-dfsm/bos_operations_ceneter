interface:
  display_name: "iCode Invoice Operations"
  short_description: "Create BH invoices or reconcile invoice evidence"
  default_prompt: "Use $icode-invoice-operations to create the exact Bright Horizons reimbursement Excel report for last week from the distributed client template. Return a short summary and attach the workbook."
dependencies:
  tools:
    - type: "mcp"
      value: "bos_icode"
      description: "BOS remote agent gateway for iCode organization"
      transport: "streamable_http"
      url: "https://dfsm.ai/mcp/apps/leaddirector/icode-operations"
policy:
  allow_implicit_invocation: true
