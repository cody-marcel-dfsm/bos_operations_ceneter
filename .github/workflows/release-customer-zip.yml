name: Release customer ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and validate customer ZIP
        run: npm run release:check
        env:
          EDUCATION_CENTER_RELEASE_OAUTH_ACCESS_TOKEN: ${{ secrets.EDUCATION_CENTER_RELEASE_OAUTH_ACCESS_TOKEN }}
          EDUCATION_CENTER_SMOKE_TIME_ZONE: ${{ vars.EDUCATION_CENTER_SMOKE_TIME_ZONE }}
      - name: Validate Claude marketplace and plugins
        run: |
          npx -y @anthropic-ai/claude-code@2.1.220 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.220 plugin validate clients/claude --strict
          for plugin in clients/claude/plugins/*; do
            npx -y @anthropic-ai/claude-code@2.1.220 plugin validate "$plugin" --strict
          done
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*-claude.zip \
            dist/release-manifest.json \
            dist/bos-operations-center-${GITHUB_REF_NAME#v}.zip \
            dist/bos-operations-center.zip \
            --generate-notes
