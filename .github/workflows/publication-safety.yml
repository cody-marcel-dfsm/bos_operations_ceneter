name: Publication safety

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-public-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify commit-bound Oracle approval
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # actions/checkout checks out GitHub's proposed merge commit for a
            # pull request. Verify that exact resulting tree before merge.
            python3 tools/oracle_approval.py verify-commit "${{ github.sha }}"
          else
            python3 tools/oracle_approval.py verify-range \
              "${{ github.event.before }}" \
              "${{ github.sha }}"
          fi
      - run: npm run check:publication
      - run: npm run release:check
