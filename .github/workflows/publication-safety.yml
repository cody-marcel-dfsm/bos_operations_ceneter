name: Publication safety

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  verify-public-repository:
    runs-on: ubuntu-latest
    env:
      VALIDATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify source maintenance or the native selected product contract
        run: python3 tools/deterministic_source.py ci --base "$VALIDATION_BASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
