name: Publication safety

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  verify-public-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify commit-bound Oracle approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR merge retains its independently approved head tree. The bounded
          # wait covers CI starting immediately after the review push.
          python3 tools/publication_status.py "${{ github.sha }}"
      - run: npm run check:publication
      - run: npm run release:check
        env:
          GH_TOKEN: ${{ github.token }}
