name: Validate package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run release:check
        env:
          BOS_API_KEY: ${{ secrets.BOS_API_KEY }}
          ICODE_SMOKE_TIME_ZONE: ${{ vars.ICODE_SMOKE_TIME_ZONE }}
      - name: Validate Claude marketplace and plugins
        run: |
          npx -y @anthropic-ai/claude-code@2.1.220 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.220 plugin validate clients/claude --strict
          for plugin in clients/claude/plugins/*; do
            npx -y @anthropic-ai/claude-code@2.1.220 plugin validate "$plugin" --strict
          done
      - name: Reject tracked credential files
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|credentials\.json$|service-account\.json$|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx|key)$)'; then
            echo "Credential-like file is tracked."
            exit 1
          fi
