[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-oracle"
version = "0.1.0"
description = "An explicit-policy proposal judge with public-corpus context and sealed specifications"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
dependencies = ["chromadb==1.0.21"]

[tool.setuptools]
packages = ["oracle_core"]
