name: Public Oracle validation

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-oracle:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ANONYMIZED_TELEMETRY: 'False'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ''
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORACLE_PUBLIC_EXPORTED_ROOT: ${{ github.workspace }}
      ORACLE_PUBLIC_SHARED_STATE: ${{ github.workspace }}/.oracle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Provision declared public dependencies and verified embedding cache
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib,pathlib,sys
          assert sys.version_info[:3] == (3,13,5), 'Pinned public Python required'
          expected='a8d50434dbca60e4c45a55ebd66f35de36b0efd515f85d3b22e4cafa7fbb9496'
          assert hashlib.sha256(pathlib.Path('requirements.lock').read_bytes()).hexdigest()==expected, 'Dependency lock differs'
          PY
          python3 -m venv .oracle/ci-runtime
          .oracle/ci-runtime/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.lock
          .oracle/ci-runtime/bin/python -B - <<'PY'
          import hashlib,json,pathlib,sys,tarfile,urllib.request
          root=pathlib.Path.cwd()
          archive=root/'.oracle/public-embedding.tar.gz'
          url='https://chroma-onnx-models.s3.amazonaws.com/all-MiniLM-L6-v2/onnx.tar.gz'
          expected='913d7300ceae3b2dbc2c50d1de4baacab4be7b9380491c27fab7418616a16ec3'
          total=0
          with urllib.request.urlopen(url,timeout=60) as response,archive.open('xb') as stream:
              while chunk:=response.read(1024*1024):
                  total+=len(chunk)
                  if total>256*1024*1024:raise RuntimeError('Public model download exceeds bound')
                  stream.write(chunk)
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise RuntimeError('Public embedding archive digest differs')
          destination=pathlib.Path.home()/'.cache/chroma/onnx_models/all-MiniLM-L6-v2'
          required={'tokenizer_config.json','special_tokens_map.json','config.json','tokenizer.json','vocab.txt','model.onnx'}
          with tarfile.open(archive,'r:gz') as tar:
              members=tar.getmembers()
              names=[str(pathlib.PurePosixPath(member.name)) for member in members]
              if len(names)!=len(set(names)) or sum(member.size for member in members)>512*1024*1024:
                  raise RuntimeError('Bounded unique model members required')
              for member in members:
                  name=pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or '..' in name.parts or not name.parts or name.parts[0]!='onnx' or str(name)!=member.name.rstrip('/') or not(member.isdir() or member.isfile()):
                      raise RuntimeError('Unsafe public model member')
                  target=destination.joinpath(*name.parts)
                  if any(path.is_symlink() for path in (target,*target.parents)):
                      raise RuntimeError('Substituted cache path')
              for member in members:
                  target=destination/member.name
                  if member.isdir():target.mkdir(parents=True,exist_ok=True);continue
                  source=tar.extractfile(member)
                  if source is None:raise RuntimeError('Missing model member content')
                  body=source.read()
                  if len(body)!=member.size:raise RuntimeError('Model member length differs')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  if target.exists():
                      if not target.is_file() or target.is_symlink() or target.read_bytes()!=body:
                          raise RuntimeError('Existing public cache differs')
                  else:
                      with target.open('xb') as stream:stream.write(body)
          if {path.name for path in (destination/'onnx').iterdir() if path.is_file()} != required:
              raise RuntimeError('Complete declared embedding cache required')
          hashes={name:hashlib.sha256((destination/'onnx'/name).read_bytes()).hexdigest() for name in sorted(required)}
          receipt={'mode':'public-ci-setup','python':sys.version.split()[0],
                   'requirements_sha256':hashlib.sha256((root/'requirements.lock').read_bytes()).hexdigest(),
                   'embedding_url':url,'embedding_archive_sha256':expected,'embedding_bytes':total,'embedding_members':hashes}
          (root/'.oracle/ci-setup.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          archive.unlink()
          PY
      - name: Run all four standalone test modules with zero skipped cases
        shell: bash
        run: |
          .oracle/ci-runtime/bin/python -B - <<'PY'
          import sys,unittest
          expected={'test_export_boundary','test_proposal_to_spec','test_public_chroma','test_runner_contract'}
          suite=unittest.defaultTestLoader.discover('tests')
          def cases(value):
              for child in value:
                  if isinstance(child,unittest.TestSuite):yield from cases(child)
                  else:yield child
          identities=[case.id() for case in cases(suite)]
          if not identities or {name.split('.')[0] for name in identities}!=expected:
              raise RuntimeError('Exact four public test modules required')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              sys.exit(1)
          PY
      - name: Measure actual synthetic-corpus Chroma retrieval
        shell: bash
        run: |
          .oracle/ci-runtime/bin/python -B benchmarks/run.py --config oracle.project.json --labels benchmarks/public_cases.json --output .oracle/ci-benchmark.json
